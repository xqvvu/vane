name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: fmt · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Matches package.json packageManager (pnpm@11.15.1).
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # engines.node is 24.x; workspace pins 24.18.0.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm -r --if-present fmt:check

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Test
        run: pnpm -r --if-present test

      - name: Build console
        run: pnpm --filter @vane/console build
