name: vane

services:
  console:
    build:
      context: .
    image: vane:local
    init: true
    restart: unless-stopped
    ports:
      - "${VANE_HTTP_PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      HOST: "0.0.0.0"
      PORT: "3000"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to a 32+ character random value}"
      SERVER_URL: "${SERVER_URL:-http://localhost:3000}"
      VANE_DATABASE_PATH: "/data/vane.sqlite"
      VANE_MAX_WEBHOOK_BYTES: "${VANE_MAX_WEBHOOK_BYTES:-1048576}"
      VANE_WORKER_BATCH_SIZE: "${VANE_WORKER_BATCH_SIZE:-10}"
      VANE_WORKER_INTERVAL_MS: "${VANE_WORKER_INTERVAL_MS:-5000}"
      VANE_WORKER_STALE_RUNNING_MS: "${VANE_WORKER_STALE_RUNNING_MS:-300000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const port = process.env.PORT || '3000'; fetch('http://127.0.0.1:' + port + '/robots.txt').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - vane-data:/data

volumes:
  vane-data:
    name: "vane-data"
